version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_job_agents_postgres
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent123
      POSTGRES_DB: ai_job_agents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_job_network

  redis:
    image: redis:7-alpine
    container_name: ai_job_agents_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_job_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_job_agents_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobagent:jobagent123@postgres:5432/ai_job_agents
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_job_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_job_agents_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobagent:jobagent123@postgres:5432/ai_job_agents
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - ai_job_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_job_agents_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobagent:jobagent123@postgres:5432/ai_job_agents
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - ai_job_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_job_agents_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - ai_job_network

volumes:
  postgres_data:
  redis_data:

networks:
  ai_job_network:
    driver: bridge
